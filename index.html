<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Typing Adventure 🌟 - Fun English Typing Game for Kids</title>
    <meta name="description" content="An interactive, colorful, and audio-guided typing adventure game designed for kids aged 5+. Learn letters, CVC words, and keyboard skills while having fun!">
    <meta name="keywords" content="kids typing, typing game, learn English, phonics, kids keyboard, typing adventure">
    <meta name="author" content="Kids Typing Adventure Team">

    <!-- Open Graph for social sharing / GitHub preview -->
    <meta property="og:title" content="Kids Typing Adventure 🌟">
    <meta property="og:description" content="Interactive, colorful, audio-guided English typing game for kids.">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/keyboard.css">
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- 1. Home View -->
        <section id="home-view" class="view active">
            <h1 class="logo-title">Kids Typing Adventure 🌟</h1>
            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="app.startGame('letter')">
                    <span class="icon">🔤</span> Letter Explorer
                </button>
                <button class="btn btn-secondary" onclick="app.startGame('word')">
                    <span class="icon">🐶</span> Word Cards
                </button>
                <button class="btn btn-tertiary" onclick="app.startGame('balloon')">
                    <span class="icon">🎈</span> Balloon Pop
                </button>
            </div>
            <button class="btn btn-sticker-book" onclick="app.showStickerBook()">
                <span class="icon">📚</span> Sticker Book
            </button>
        </section>

        <!-- 2. Game View -->
        <section id="game-view" class="view hidden">
            <!-- Top Bar -->
            <header class="game-header">
                <button class="btn btn-icon btn-back" onclick="app.goHome()">🔙</button>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="level-progress"></div>
                </div>
                <div class="stars-display" id="current-stars">⭐ 0</div>
            </header>

            <!-- Main Play Area (Dynamic content injected here) -->
            <main class="play-area" id="play-area">
                <!-- Modes will inject their HTML here -->
            </main>

            <!-- Virtual Keyboard -->
            <footer class="keyboard-container" id="virtual-keyboard">
                <!-- Keyboard generated by keyboard.js -->
            </footer>
        </section>

        <!-- 3. Sticker Book View -->
        <section id="sticker-view" class="view hidden">
            <header class="sticker-header">
                <button class="btn btn-icon btn-back" onclick="app.goHome()">🔙</button>
                <h2>My Sticker Book 🏆</h2>
            </header>
            <div class="sticker-grid" id="sticker-grid">
                <!-- Stickers generated dynamically -->
            </div>
        </section>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay hidden"></div>
        <!-- Level Complete Modal -->
        <div id="level-complete-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="level-title-display">Level Complete!</h2>
                <div class="stars-rating" id="modal-stars"></div>
                <div class="sticker-reward" id="modal-sticker-reward"></div>
                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="app.nextLevel()">Next ➡️</button>
                    <button class="btn btn-secondary" onclick="app.goHome()">Home 🏠</button>
                </div>
            </div>
        </div>

        <!-- Eye Care Break Modal -->
        <div id="break-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Time to Rest! 🧘‍♂️</h2>
                <div class="break-character">🐻</div>
                <p>Great job! Let's rest our eyes for a moment.</p>
                <button class="btn btn-primary" onclick="app.resumeFromBreak()">I'm Ready! ▶️</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/letterMode.js"></script>
    <script src="js/wordMode.js"></script>
    <script src="js/balloonMode.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
