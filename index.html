<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Typing Adventure 🌟 - Fun English Typing Game for Kids</title>
    <meta name="description" content="A complete 30-lesson typing course for kids aged 5+. Learn home row, letters, numbers, words and sentences with finger guidance.">
    <meta property="og:title" content="Kids Typing Adventure 🌟">
    <meta property="og:description" content="Complete 30-lesson typing course with finger guidance for kids.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/keyboard.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="app">
        <!-- ===== HOME VIEW: Lesson Map ===== -->
        <section id="home-view" class="view active">
            <div class="home-header">
                <h1 class="logo-title">⌨️ Kids Typing Adventure</h1>
                <p class="logo-subtitle">Learn to type step by step!</p>
            </div>
            <div class="lesson-map" id="lesson-map">
                <!-- Generated by app.js -->
            </div>
        </section>

        <!-- ===== GAME VIEW: Typing Practice ===== -->
        <section id="game-view" class="view hidden">
            <!-- Top Bar -->
            <header class="game-header">
                <button class="btn btn-icon" onclick="app.goHome()">🏠</button>
                <div class="lesson-title" id="lesson-title">Lesson 1</div>
                <div class="stats-bar">
                    <span class="stat" id="stat-accuracy">Accuracy: --</span>
                    <span class="stat" id="stat-wpm">WPM: --</span>
                </div>
                <button class="btn btn-icon btn-toggle-hands" id="btn-toggle-hands" onclick="app.toggleHands()">🖐️</button>
            </header>

            <!-- Typing Area -->
            <main class="typing-area">
                <div class="typing-prompt" id="typing-prompt">
                    <!-- Characters rendered here -->
                </div>
                <div class="typing-progress-bar">
                    <div class="typing-progress-fill" id="typing-progress"></div>
                </div>
            </main>

            <!-- Finger Guide Panel -->
            <div class="finger-guide" id="finger-guide">
                <div class="hand hand-left">
                    <div class="finger" data-finger="lp" data-zone="pink"><span>小指</span></div>
                    <div class="finger" data-finger="lr" data-zone="orange"><span>无名</span></div>
                    <div class="finger" data-finger="lm" data-zone="yellow"><span>中指</span></div>
                    <div class="finger" data-finger="li" data-zone="green"><span>食指</span></div>
                    <div class="finger" data-finger="lt" data-zone="grey"><span>拇指</span></div>
                </div>
                <div class="hand hand-right">
                    <div class="finger" data-finger="rt" data-zone="grey"><span>拇指</span></div>
                    <div class="finger" data-finger="ri" data-zone="blue"><span>食指</span></div>
                    <div class="finger" data-finger="rm" data-zone="teal"><span>中指</span></div>
                    <div class="finger" data-finger="rr" data-zone="purple"><span>无名</span></div>
                    <div class="finger" data-finger="rp" data-zone="rose"><span>小指</span></div>
                </div>
            </div>

            <!-- Keyboard + Remaining Counter -->
            <div class="keyboard-wrapper">
                <footer class="keyboard-container" id="virtual-keyboard">
                    <!-- Generated by keyboard.js -->
                </footer>
                <div class="typing-remaining" id="typing-remaining"></div>
            </div>
        </section>

        <!-- ===== GAME VIEW: Balloon Pop ===== -->
        <section id="balloon-game-view" class="view hidden">
            <div class="game-header">
                <button class="btn btn-secondary btn-icon" onclick="app.switchView('home-view')">◀</button>
                <div class="lesson-title" id="game-title">Balloon Pop</div>
                <div class="stats-bar">
                    <span class="stat" id="game-score">Score: 0 / 10</span>
                </div>
            </div>
            <main class="game-area" id="balloon-area">
                <!-- Balloons spawn here -->
            </main>
        </section>

        <!-- ===== MODALS ===== -->
        <div id="modal-overlay" class="modal-overlay hidden"></div>

        <!-- Parent Gate Modal -->
        <div id="parent-gate-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Parent Verification 🔒</h2>
                <p style="margin-bottom: 1rem; color: var(--color-text-dim);">To unlock this level, please answer:</p>
                <div id="parent-math-problem" style="font-size: 2rem; font-weight: 700; margin-bottom: 1rem;"></div>
                <input type="number" id="parent-math-input" placeholder="?" style="font-size: 1.5rem; text-align: center; width: 100px; padding: 0.5rem; border: 2px solid var(--color-accent); border-radius: var(--radius-sm); outline: none;">
                <p id="parent-math-error" style="color: var(--color-error); margin-top: 0.5rem; display: none;">Incorrect, try again.</p>
                <div class="modal-actions" style="margin-top: 1.5rem;">
                    <button class="btn btn-primary" onclick="app.verifyParentGate()">Unlock</button>
                    <button class="btn btn-secondary" onclick="app.closeParentGate()">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Lesson Complete -->
        <div id="lesson-complete-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 Lesson Complete!</h2>
                <div class="result-stats" id="result-stats"></div>
                <div class="stars-rating" id="modal-stars"></div>
                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="app.nextLesson()">Next Lesson ➡️</button>
                    <button class="btn btn-secondary" onclick="app.restartLesson()">Try Again 🔄</button>
                    <button class="btn btn-ghost" onclick="app.goHome()">Home 🏠</button>
                </div>
            </div>
        </div>

        <!-- Break Reminder -->
        <div id="break-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Time to Rest! 🧘</h2>
                <div class="break-character">🐻</div>
                <p>Great job! Let's rest our eyes.</p>
                <button class="btn btn-primary" onclick="app.resumeFromBreak()">I'm Ready! ▶️</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/typingMode.js"></script>
    <script src="js/gameMode.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
