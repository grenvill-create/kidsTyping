  <!-- Asteroid Body -->
  <path d="M 20 20 Q 50 5, 80 20 T 95 60 Q 80 95, 50 90 T 5 60 Q 5 35, 20 20 Z" fill="url(#rock)" stroke="#2d3436" stroke-width="2"/>
  
  <!-- Craters -->
