  <ellipse cx="65" cy="65" rx="15" ry="10" fill="url(#crater)" transform="rotate(30 65 65)" opacity="0.8"/>
  <ellipse cx="70" cy="25" rx="8" ry="6" fill="url(#crater)" opacity="0.7"/>
