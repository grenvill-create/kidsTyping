<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="snout" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="100%" stop-color="#ff69b4" />
    </radialGradient>
    <radialGradient id="helmet" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFACD" />
      <stop offset="100%" stop-color="#FFD700" />
    </radialGradient>
  </defs>
  <!-- Body -->
  <path d="M 15 100 C 15 30, 85 30, 85 100 Z" fill="#5c4033" />
  <!-- Belly -->
  <path d="M 30 100 C 30 70, 70 70, 70 100 Z" fill="#d2b48c" />
  <!-- Cheeks -->
  <circle cx="30" cy="58" r="6" fill="#ff9999" opacity="0.7"/>
  <circle cx="70" cy="58" r="6" fill="#ff9999" opacity="0.7"/>
  <!-- Eyes -->
  <circle cx="38" cy="50" r="5" fill="#000" />
  <circle cx="62" cy="50" r="5" fill="#000" />
  <!-- Eye sparkles -->
  <circle cx="36" cy="48" r="1.5" fill="#fff" />
  <circle cx="60" cy="48" r="1.5" fill="#fff" />
  <!-- Snout -->
  <ellipse cx="50" cy="62" rx="16" ry="11" fill="#ffe4c4" />
  <circle cx="50" cy="58" r="4" fill="url(#snout)" />
  <path d="M 50 62 Q 50 68 45 68 M 50 62 Q 50 68 55 68" fill="none" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hard Hat -->
  <path d="M 22 35 C 22 5, 78 5, 78 35 Z" fill="url(#helmet)" />
  <path d="M 10 35 Q 50 45 90 35 Q 90 40 50 45 Q 10 40 10 35 Z" fill="#DAA520" />
  <circle cx="50" cy="15" r="5" fill="#FFA500" />
</svg>
